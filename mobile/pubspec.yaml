name: pocket_ledger_mobile
description: "Pocket Ledger offline-first Android companion."
publish_to: "none"
version: 0.5.0+1

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  decimal: 3.2.7
  drift: 2.35.4
  flutter_riverpod: 3.5.0
  flutter_svg: 2.5.0
  go_router: 18.1.4
  intl: 0.20.3
  material_ui: 1.11.1
  path: 1.9.1
  path_provider: 2.1.6
  sqlite3: 3.9.2
  uuid: 4.6.0
  csv: ^8.0.0
  file_picker: ^13.4.1
  crypto: ^3.0.8

dev_dependencies:
  build_runner: 2.17.1
  drift_dev: 2.35.3
  flutter_lints: 6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/icons/Mobile.svg
